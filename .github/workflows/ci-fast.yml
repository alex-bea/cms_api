name: Fast CI

on:
  pull_request:
    paths:
      - "cms_pricing/**"
      - "tests/**"
      - "tools/**"
      - "requirements*.txt"
      - "requirements.lock"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/ci-fast.yml"
  push:
    branches: [main]
    paths:
      - "cms_pricing/**"
      - "tests/**"
      - "tools/**"
      - "requirements*.txt"
      - "requirements.lock"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/ci-fast.yml"

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-python-quality:
    name: Changed Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Determine changed Python files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            base="origin/${BASE_REF}"
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch origin "$BASE_REF" --depth=1
              base="origin/${BASE_REF}"
            fi
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- "*.py" |
              grep -E "^(cms_pricing|tests|tools)/" || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf "%s\n" "${files[@]}" > /tmp/changed-python-files.txt
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          printf "Changed Python files:\n"
          cat /tmp/changed-python-files.txt

      - name: Compile changed Python files
        if: steps.changed.outputs.has_files == 'true'
        run: xargs python -m py_compile < /tmp/changed-python-files.txt

      - name: Black check on changed files
        if: steps.changed.outputs.has_files == 'true'
        run: xargs black --check < /tmp/changed-python-files.txt

      - name: isort check on changed files
        if: steps.changed.outputs.has_files == 'true'
        run: xargs isort --check-only < /tmp/changed-python-files.txt

      - name: Critical flake8 check on changed files
        if: steps.changed.outputs.has_files == 'true'
        run: |
          xargs flake8 \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            < /tmp/changed-python-files.txt

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run fast smoke tests
        run: |
          pytest \
            tests/api/test_openapi_consistency.py \
            tests/utils/test_snapshot_fallback.py \
            tests/normalize/test_locality_fips_normalization.py \
            tests/test_normalize_string_columns.py \
            tests/ingestion/test_gpci_parser_golden.py \
            tests/ingestion/test_gpci_parser_negatives.py \
            tests/ingestion/test_pprrvu_parser.py \
            -q
