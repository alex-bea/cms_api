name: OpenAPI Diff (breaking-change gate)
on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4:00 UTC
  pull_request:
    paths: ["api-contracts/openapi.yaml"]

jobs:
  oas-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install oasdiff
        run: |
          go install github.com/oasdiff/oasdiff@v1.18.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Fetch base branch spec
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Materialize base branch spec
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git show "origin/${BASE_REF}:api-contracts/openapi.yaml" > /tmp/base-openapi.yaml

      - name: Breaking change check
        run: |
          set +e
          oasdiff breaking --fail-on ERR /tmp/base-openapi.yaml api-contracts/openapi.yaml
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "No OpenAPI breaking changes detected."
            exit 0
          fi

          echo "Breaking change detected by oasdiff."
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            exit "$status"
          fi

          labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
          if grep -qx "major" <<<"$labels"; then
            echo "Major label present: allowing intentional breaking change."
            exit 0
          fi

          echo "No 'major' label: failing."
          exit "$status"
