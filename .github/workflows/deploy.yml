name: Build and Deploy to Render

on:
  # Build on every push to main (CI) and deploy on tags (CD)
  push:
    branches: [main]
    tags:
      - 'v*.*.*'  # Matches v1.0.0, v1.2.3, etc.
  
  # Allow manual trigger
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          target: production

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only deploy on tags (not on regular pushes)
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Deploy to Render
        id: trigger_deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          echo "Deploying to Render with tag: ${{ github.ref_name }}"
          
          # Step 1: Deploy with specific image tag (URL-encoded)
          IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          ENCODED_IMAGE=$(echo -n "$IMAGE_TAG" | jq -sRr @uri)
          
          HTTP_CODE=0
          DEPLOY_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_IMAGE}")
          HTTP_CODE=$(echo "$DEPLOY_RESPONSE" | tail -n1)
          BODY=$(echo "$DEPLOY_RESPONSE" | sed '$d')
          echo "Deploy hook status: $HTTP_CODE"
          echo "Deploy hook body: $BODY"
          
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Deploy hook HTTP $HTTP_CODE"
            exit 1
          fi

          # Try to parse JSON only if body looks like JSON
          if echo "$BODY" | grep -q '{'; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.deploy.id // empty')
          else
            DEPLOY_ID=""
          fi
          if [ -z "$DEPLOY_ID" ]; then
            echo "❌ Failed to trigger deployment. Response did not include deploy.id"
            exit 1
          fi

          echo "✅ Deployment triggered with image: $IMAGE_TAG (deploy id: $DEPLOY_ID)"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger_deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_ID}" ]; then
            echo "❌ Missing deploy id output from deploy step."
            exit 1
          fi

          echo "Waiting for Render deploy ${DEPLOY_ID} to reach live status..."

          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))

            DEPLOY_STATUS=$(curl -sS \
              "https://api.render.com/v1/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | jq -r '.status // empty')

            if [ -z "$DEPLOY_STATUS" ]; then
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Unable to read deploy status (empty response)"
              continue
            fi

            echo "Deploy status: $DEPLOY_STATUS (attempt $ATTEMPT/$MAX_ATTEMPTS)"

            case "$DEPLOY_STATUS" in
              live|succeeded)
                echo "✅ Deploy ${DEPLOY_ID} is live."
                break
                ;;
              failed|canceled|deactivated|build_failed|build_timed_out)
                echo "❌ Deploy ${DEPLOY_ID} did not succeed (status: $DEPLOY_STATUS)"
                exit 1
                ;;
            esac
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ Deploy ${DEPLOY_ID} did not reach live state within timeout."
            exit 1
          fi
      
      - name: Run Database Migrations (One-Off Job)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Running database migrations via One-Off Job..."
          
          # Step 2: Trigger one-off job with alembic upgrade head
          # One-off jobs use the service's latest successful build artifact + env
          JOB_RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/jobs" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"startCommand":"alembic upgrade head"}')
          
          # Extract job ID
          JOB_ID=$(echo "$JOB_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          if [ -z "$JOB_ID" ]; then
            echo "❌ Failed to start migration job. Response: $JOB_RESPONSE"
            exit 1
          fi
          
          echo "Migration job started with ID: $JOB_ID"
          
          # Step 3: Poll job status until completed (max 5 minutes)
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
            
            JOB_STATUS=$(curl -s \
              "https://api.render.com/v1/jobs/${JOB_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            
            echo "Migration status: $JOB_STATUS (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            
            if [ "$JOB_STATUS" = "succeeded" ]; then
              echo "✅ Migrations completed successfully"
              break
            elif [ "$JOB_STATUS" = "failed" ]; then
              echo "❌ Migration job failed - check Render Jobs page for logs"
              exit 1
            fi
          done
          
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ Migration job timed out after 5 minutes"
            exit 1
          fi
      
      - name: Deployment Complete
        run: |
          echo "🎉 Deployment complete!"
          echo "Service URL: https://cms-pricing-api.onrender.com"
          echo "Health check: https://cms-pricing-api.onrender.com/health"
